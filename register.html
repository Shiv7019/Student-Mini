
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f2f5fa;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000012;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #243b64;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #2457d6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Registration</h2>

    <form id="registerForm">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name"
               required maxlength="100" autocomplete="name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               required maxlength="150" autocomplete="email">

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile"
               required maxlength="20" autocomplete="tel">

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required minlength="8" autocomplete="new-password">

        <button type="submit" id="submitBtn">
            Register Student
        </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
</div>

<script>
const form = document.getElementById('registerForm');
const message = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? 'green' : 'red';
}

form.addEventListener('submit', async function (event) {
    event.preventDefault();

    const data = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        password: document.getElementById('password').value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Registering...';
    message.textContent = '';

    try {
        // Step 1: Request a CSRF token from the central API.
        const csrfResponse = await fetch(
            'api/csrf.php',
            {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json'
                }
            }
        );

        const csrfResult = await csrfResponse.json();

        if (
            !csrfResponse.ok ||
            !csrfResult.success ||
            !csrfResult.data ||
            !csrfResult.data.csrf_token
        ) {
            throw new Error(
                csrfResult.message || 'Could not obtain security token.'
            );
        }

        // Step 2: Submit registration to the central API.
        const response = await fetch(
            'api/register.php',
            {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-CSRF-Token': csrfResult.data.csrf_token
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            showMessage(
                result.message || 'Registration failed. Please try again.'
            );
            return;
        }

        form.reset();

        const studentId = result.data?.student_id;

        showMessage(
            (result.message || 'Student registered successfully.') +
            (studentId ? ' Student ID: ' + studentId : ''),
            true
        );

    } catch (error) {
        showMessage(
            error.message ||
            'Could not connect to the API. Check XAMPP Apache and PHP.'
        );
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Student';
    }
});
</script>

</body>
</html>
